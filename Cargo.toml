[package]
name = "navodka"
version = "0.1.0"
edition = "2024"
[dependencies]
windows-capture = "=2.0.1"
native-windows-gui = {optional=true,version="1.0.13",default-features=false,features=["file-dialog","notice","combobox","high-dpi","message-window","image-decoder"]}
open = {version="5",optional=true}
[profile.release]
strip = true
[build-dependencies]
winresource = "0.1"

[features]
legacy-ui = ["dep:native-windows-gui", "dep:open"]

[[bin]]
name = "navodka"
path = "src/main.rs"
required-features = ["legacy-ui"]
